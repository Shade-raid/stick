/* =====================================================================
   STICK FIGHTER — DELUXE EDITION
   ---------------------------------------------------------------------
   HOW THE ANIMATION WORKS (the part that makes it easy):
   A "pose" is just a set of joint angles. To animate, you list poses
   with durations and the engine blends between them. A punch is:
       wind-up pose -> strike pose -> idle pose
   To make a new move: copy a pose, tweak numbers, add it to ATK below.

   Angles are in radians, 0 = pointing straight down, +1.57 = straight
   forward (toward the way the fighter faces), 3.14 = straight up.
     lean  torso lean (+ = forward)
     a1,a2 front arm: upper arm angle, forearm bend (relative to upper)
     b1,b2 back arm
     c1,c2 front leg: thigh angle, shin bend
     d1,d2 back leg

   NEW IN THE DELUXE EDITION
   - Main menu with attract-mode demo fight behind it
   - 6 selectable fighters (different speed / power / HP / look)
   - 4 arenas incl. one with falling snow
   - New moves: UPPERCUT (S+J, launcher), SWEEP (S+K, unblockable
     knockdown), SUPER ART (L when your meter is full)
   - Knockdowns & get-ups, round timer, super meter, combo counters,
     match stats, PERFECT bonus
   - Modes: ARCADE ladder (level saved), QUICK FIGHT, local 2 PLAYERS,
     TRAINING (T = toggle CPU, R = reset)
   - Pause menu (Esc/P), options (sound / shake / difficulty),
     chiptune music, everything controlled by keyboard OR mouse
   ===================================================================== */

// ---------- SOUND ----------
let AC = null;
function initAC() { if (!AC) try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function tone(f1, f2, dur, type, vol) {
  if (!AC || !OPTS.sound) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  whoosh: () => tone(400, 120, .08, 'sawtooth', .03),
  hit:    () => { tone(180, 40, .12, 'square', .09); tone(900, 200, .05, 'sawtooth', .04); },
  block:  () => tone(500, 300, .06, 'triangle', .06),
  ko:     () => tone(260, 30, .6, 'sawtooth', .1),
  jump:   () => tone(200, 500, .1, 'triangle', .04),
  thud:   () => tone(120, 45, .15, 'square', .09),
  blip:   () => tone(700, 700, .04, 'square', .03),
  sel:    () => tone(500, 900, .09, 'square', .05),
  super:  () => tone(200, 900, .25, 'sawtooth', .08),
  timeup: () => { tone(880, 880, .12, 'square', .06); setTimeout(() => tone(660, 660, .2, 'square', .06), 130); },
  win:    () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, f, .18, 'square', .05), i * 130))
};
// tiny chiptune bass loop for fights
const MUSIC = {
  on: false, timer: null, step: 0, next: 0,
  seq: [110, 0, 110, 131, 110, 0, 82, 98, 110, 0, 110, 131, 147, 131, 98, 82],
  start() { if (!AC || !OPTS.sound || this.on) return; this.on = true; this.step = 0; this.next = AC.currentTime + .1;
            this.timer = setInterval(() => this.tick(), 80); },
  stop() { this.on = false; if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  tick() {
    while (this.next < AC.currentTime + .25) {
      const n = this.seq[this.step % 16];
      if (n) {
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = 'square'; o.frequency.value = n;
        g.gain.setValueAtTime(.022, this.next); g.gain.exponentialRampToValueAtTime(.001, this.next + .13);
        o.connect(g); g.connect(AC.destination); o.start(this.next); o.stop(this.next + .14);
      }
      this.step++; this.next += .15;
    }
  }
};

// ---------- GAME STATE ----------

            lvl: store.get('sf_lvl', 1), mode: 'quick', p1c: 0, p2c: 1, stageI: 0, aiLvl: 2,
            sparks: [], pops: [], winner: null, koReason: null, perfect: 0, paused: false, clock: 60,
            sel: 0, selP: 1, mx: -99, my: -99, ui: [], stats: { time: 0, maxCombo: [0, 0], dmg: [0, 0] },
            flakes: [], demoT: 0, spar: false, optMsg: '', optMsgT: 0 };
let P1, E;

// ---------- INPUT MAPS ----------
const MAP1 = { left: ['KeyA'], right: ['KeyD'], jump: ['KeyW'], block: ['KeyS'],
               punch: ['KeyJ', 'KeyZ'], kick: ['KeyK', 'KeyX'], super: ['KeyL', 'KeyC'] };
const MAP1solo = { left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], jump: ['KeyW', 'ArrowUp', 'Space'],
                   block: ['KeyS', 'ArrowDown'], punch: ['KeyJ', 'KeyZ', 'Comma'], kick: ['KeyK', 'KeyX', 'Period'],
                   super: ['KeyL', 'KeyC', 'Slash'] };
const MAP2 = { left: ['ArrowLeft'], right: ['ArrowRight'], jump: ['ArrowUp'], block: ['ArrowDown'],
               punch: ['Comma', 'Numpad1'], kick: ['Period', 'Numpad2'], super: ['Slash', 'Numpad3'] };
const down = (list) => list && list.some(k => keys[k]);
function invertMap(m) { const o = {}; for (const act in m) for (const k of m[act]) o[k] = act; return o; }

// ---------- FIGHTER ----------
function limb(o, l1, l2, a, b) {
  const e = { x: o.x + Math.sin(a) * l1, y: o.y + Math.cos(a) * l1 };
  const t = a + b;
  return [e, { x: e.x + Math.sin(t) * l2, y: e.y + Math.cos(t) * l2 }];
}
// pure math: pose+scale -> joint offsets around the hip (0,0), plus top/bottom
function computePose(p, sc) {
  const dir = { x: Math.sin(p.lean), y: -Math.cos(p.lean) };
  const sh = { x: dir.x * 38 * sc, y: dir.y * 38 * sc };
  const head = { x: sh.x + dir.x * 21 * sc, y: sh.y + dir.y * 21 * sc };
  const hip = { x: 0, y: 0 };
  const [aE, aH] = limb(sh, 20 * sc, 20 * sc, p.a1, p.a2);
  const [bE, bH] = limb(sh, 20 * sc, 20 * sc, p.b1, p.b2);
  const [cK, cF] = limb(hip, 24 * sc, 24 * sc, p.c1, p.c2);
  const [dK, dF] = limb(hip, 24 * sc, 24 * sc, p.d1, p.d2);
  const R = { hip, sh, head, aE, aH, bE, bH, cK, cF, dK, dF };
  let low = -1e9, top = 1e9;
  for (const k in R) { low = Math.max(low, R[k].y); top = Math.min(top, R[k].y); }
  low = Math.max(low, head.y + 11 * sc); top = Math.min(top, head.y - 11 * sc);
  return { R, low, top };
}
// draws one stick figure from world-space points (shared by game + menus)
function drawStick(c, pts, col, face, hair, sc, t) {
  c.lineCap = c.lineJoin = 'round';
  const lw = Math.max(3.5, 6 * sc / 1.3);
  c.lineWidth = lw; c.strokeStyle = col; c.fillStyle = col;
  const L = (...pp) => { c.beginPath(); c.moveTo(pp[0].x, pp[0].y); for (let i = 1; i < pp.length; i++) c.lineTo(pp[i].x, pp[i].y); c.stroke(); };
  c.globalAlpha = .6; L(pts.sh, pts.bE, pts.bH); L(pts.hip, pts.dK, pts.dF); c.globalAlpha = 1;
  L(pts.hip, pts.sh);
  c.fillStyle = '#f6f2e6'; c.beginPath(); c.arc(pts.head.x, pts.head.y, 11 * sc, 0, 7); c.fill(); c.stroke();
  c.fillStyle = col; c.beginPath(); c.arc(pts.head.x + face * 5 * sc, pts.head.y - 2 * sc, 2.2, 0, 7); c.fill();
  const hy = pts.head.y;
  if (hair === 'band') {         // red headband with a flapping tail
    c.strokeStyle = '#e0242b'; c.lineWidth = 4;
    const by = hy - 5 * sc;
    L({ x: pts.head.x - 10.5 * sc, y: by }, { x: pts.head.x + 10.5 * sc, y: by });
    L({ x: pts.head.x - face * 10 * sc, y: by }, { x: pts.head.x - face * (10 * sc + 18 + 4), y: by + Math.sin(t * 14) * 4 });
  } else if (hair === 'spike') { // spiky hair
    c.lineWidth = 4;
    for (let i = -1; i <= 1; i++) L({ x: pts.head.x + i * 6 * sc, y: hy - 10 * sc }, { x: pts.head.x + i * 9 * sc, y: hy - 19 * sc });
  } else if (hair === 'cap') {   // beanie + brim
    c.fillStyle = col; c.beginPath(); c.arc(pts.head.x, hy - 2 * sc, 11.5 * sc, Math.PI, 0); c.fill();
    c.strokeStyle = col; c.lineWidth = 4;
    L({ x: pts.head.x + face * 2 * sc, y: hy - 6 * sc }, { x: pts.head.x + face * 15 * sc, y: hy - 5 * sc });
  } else if (hair === 'pony') {  // ponytail
    c.lineWidth = 4;
    L({ x: pts.head.x - face * 9 * sc, y: hy - 6 * sc },
      { x: pts.head.x - face * (17 + Math.sin(t * 10) * 2) * sc, y: hy + 6 * sc },
      { x: pts.head.x - face * (19 + Math.sin(t * 10 + 1) * 3) * sc, y: hy + 16 * sc });
  } else if (hair === 'hawk') {  // mohawk
    c.lineWidth = 4;
    for (let i = -1; i <= 1; i++) L({ x: pts.head.x + i * 4.5 * sc, y: hy - 10 * sc }, { x: pts.head.x + i * 5.5 * sc, y: hy - (20 - Math.abs(i) * 5) * sc });
  } else {                       // bald: brow + scar
    c.lineWidth = 2.5;
    L({ x: pts.head.x + face * 2 * sc, y: hy - 6 * sc }, { x: pts.head.x + face * 8 * sc, y: hy - 5 * sc });
    L({ x: pts.head.x + face * 4 * sc, y: hy + 3 * sc }, { x: pts.head.x + face * 8 * sc, y: hy - 2 * sc });
  }
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = lw;
  L(pts.hip, pts.cK, pts.cF); L(pts.sh, pts.aE, pts.aH);
  for (const h of [pts.aH, pts.bH]) { c.beginPath(); c.arc(h.x, h.y, 5, 0, 7); c.fill(); }
}
// static figure for menus (character cards / move diagrams)
function menuFigure(idx, pose, x, fy, face, scale) {
  const ch = CHARS[idx], sc = ch.sc * (scale || 1);
  const { R, low } = computePose(pose, sc);
  const pts = {};
  for (const k in R) pts[k] = { x: x + face * R[k].x, y: R[k].y + fy - low };
  drawStick(ctx, pts, ch.col, face, ch.hair, sc, G.time);
}

class F {
  constructor(x, face, ci, ctrl, alt) {
    const c = CHARS[ci];
    Object.assign(this, { x, face, ci, char: c, ctrl, col: (alt ? c.col2 : c.col), hair: c.hair, sc: c.sc,
      hp: c.hp, maxhp: c.hp, spd: c.spd, dmgM: c.dmg, aspd: c.aspd, meterM: c.meterM, meter: 0, lag: c.hp,
      air: 0, vy: 0, vx: 0, st: 'idle', loop: null, anim: null, atk: null, buf: null, didHit: false,
      downPend: 0, hitOn: false, flash: 0, combo: 0, comboT: 0, gy: GROUND, map: null, keymap: null });
    this.pose = { ...IDLE };
    this.inp = { mv: 0, jump: 0, punch: 0, kick: 0, super: 0, block: false };
    this.ai = { t: .5, mode: 'wait', combo: false };
    this.compute();
  }

  play(frames, loop) { this.anim = { frames, i: 0, t: 0, from: { ...this.pose }, loop: !!loop }; }
  loopPose(name, frames) { if (this.loop !== name) { this.loop = name; this.play(frames, true); } }

  // blend current pose toward the active keyframe. returns true when a one-shot anim finishes
  updateAnim(dt) {
    const a = this.anim; if (!a) return false;
    const f = a.frames[a.i];
    a.t += dt;
    const k = clamp(a.t / f.d, 0, 1), e = k * k * (3 - 2 * k);
    for (const key of KEYS) this.pose[key] = a.from[key] + (f.p[key] - a.from[key]) * e;
    if (a.t >= f.d) {
      a.i++; a.t = 0; a.from = { ...this.pose };
      if (a.i >= a.frames.length) {
        if (a.loop) a.i = 0; else { this.anim = null; return true; }
      }
    }
    return false;
  }

  start(name) {
    const a = ATK[name];
    this.st = 'attack'; this.atk = a; this.loop = null; this.buf = null; this.didHit = false; this.downPend = 0;
    this.play(a.fr);
    this.vx = this.face * (a.step || 0);

  }

  enterDown() {

    this.play([{ p: KDOWN, d: .14 }, { p: KDOWN, d: .85 }]);

  }

  update(dt) {
    for (const k of ['jump', 'punch', 'kick', 'super']) if (this.inp[k] > 0) this.inp[k] -= dt;
    this.hitOn = false;
    if (this.flash > 0) this.flash -= dt;
    if (this.comboT > 0) { this.comboT -= dt; if (this.comboT <= 0) this.combo = 0; }

    // vertical physics
    if (this.air > 0 || this.vy > 0) {
      this.air += this.vy * dt; this.vy -= 2300 * dt;
      if (this.air <= 0) {
        this.air = 0; this.vy = 0;

      }
    }
    // horizontal
    this.x += this.vx * dt; this.vx -= this.vx * Math.min(1, 6 * dt);
    this.x = clamp(this.x, 50, W - 50);

    // attacks animate at the character's own speed
    const adt = this.st === 'attack' ? dt * this.aspd : dt;
    const done = this.updateAnim(adt);

    if (this.st === 'ko') return;
    if (this.st === 'down') { if (done) { this.st = 'getup'; this.play([{ p: IDLE, d: .3 }]); } return; }
    if (this.st === 'getup') { if (done) this.st = 'idle'; return; }
    if (this.st === 'hit') { if (done) this.st = 'idle'; return; }
    if (this.st === 'attack') {
      if (done) { this.st = 'idle'; return; }
      const an = this.anim;
      if (an) {
        const fr = an.frames[an.i];
        this.hitOn = !!fr.hit && !this.didHit;
        if (this.inp.punch > 0 && this.atk.chain && an.i >= 1 && !this.atk.super) { this.buf = this.atk.chain; this.inp.punch = 0; }
        if (this.buf && an.i >= 2 && !this.atk.super) { this.start(this.buf); return; }
      }
      if (this.atk.air && this.air > 0) this.x += this.inp.mv * SPEED * .5 * dt;
      return;
    }
    this.free(dt);
  }

  free(dt) {
    const o = this.opp, i = this.inp, gr = this.air <= 0;

    }
    if (gr) this.face = o.x >= this.x ? 1 : -1;
    if (i.super > 0) { i.super = 0; if (gr && this.meter >= 100) { this.start('super'); return; } }
    if (i.punch > 0 && gr) { i.punch = 0; this.start(i.block ? 'upper' : 'jab'); return; }
    if (i.kick > 0) { i.kick = 0; this.start(i.block ? 'sweep' : (gr ? 'kick' : 'jkick')); return; }

    else if (blk) this.loopPose('block', [{ p: BLOCK, d: .08 }]);
    else if (mv) this.loopPose('walk', [{ p: WALK_A, d: .17 }, { p: WALK_B, d: .17 }]);
    else this.loopPose('idle', IDLE_ANIM);
  }

  // turn joint angles into world-space points; auto-plants the lowest point on the ground
  compute() {
    const { R, low, top } = computePose(this.pose, this.sc);
    const shift = this.gy - low - this.air;
    this.pts = {};
    for (const k in R) this.pts[k] = { x: this.x + this.face * R[k].x, y: R[k].y + shift };

  draw(shadow) {

}

// ---------- COMBAT ----------
const WORDS = ['POW', 'WHAM', 'BAM', 'SMACK', 'THWACK', 'BONK', 'CRACK'];
function spark(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.283), s = rand(150, 420);
    G.sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.15, .35), col });
  }
}
function pop(text, x, y, col) { G.pops.push({ text, x, y, life: .55, rot: rand(-.35, .35), col }); }

function strike(att, def) {
  const a = att.atk, fr = att.anim ? att.anim.frames[att.anim.i] : null;
  const hand = (fr && fr.hand) || a.hand;
  const dmg = Math.round(((fr && fr.dmg) || a.dmg) * att.dmgM);
  const kb = (fr && fr.kb) || a.kb;
  const launch = (fr && fr.launch) || a.launch;
  const down = (fr && fr.down) || a.down;
  att.didHit = true; att.hitOn = false;
  const h = att.pts[hand];
  const blocking = !a.unblock && def.st === 'idle' && def.inp.block && def.air <= 0 && def.face === (att.x > def.x ? 1 : -1);
  if (blocking) {
    def.hp = Math.max(1, def.hp - dmg * .15);
    def.vx = att.face * kb * .3; att.vx = -att.face * 120;
    def.meter = clamp(def.meter + dmg * .6, 0, 100); att.meter = clamp(att.meter + dmg * .4, 0, 100);
    spark(h.x, h.y, '#777', 6); pop('BLOCK', h.x, h.y - 20, '#667');
    G.hitstop = .04; if (OPTS.shake) G.shake = 2; sfx.block();
    return;
  }
  def.hp -= dmg; def.flash = .14; def.st = 'hit'; def.loop = null; def.buf = null;
  def.vx = att.face * kb;

  if (down) { if (launch) def.downPend = 1; else def.enterDown(); }

  if (G.state === 'fight') {

    G.stats.dmg[ai] += dmg;
    G.stats.maxCombo[ai] = Math.max(G.stats.maxCombo[ai], att.combo);
  }
  att.meter = clamp(att.meter + dmg * 1.1 * att.meterM, 0, 100);
  def.meter = clamp(def.meter + dmg * .7 * def.meterM, 0, 100);
  spark(h.x, h.y, '#ff9d00', 10); spark(h.x, h.y, '#222', 5);
  pop(WORDS[irand(0, WORDS.length - 1)] + '!', h.x, h.y - 25, '#e0242b');
  G.hitstop = launch ? .09 : .06; if (OPTS.shake) G.shake = 5 + dmg * .5; sfx.hit();

    def.play([{ p: HIT, d: .08 }, { p: KO, d: .45 }]);

    G.state = 'ko'; G.t = 0; G.ts = .3; G.winner = att; G.koReason = 'ko'; G.hitstop = .15;
    if (OPTS.shake) G.shake = 14;

function checkHits(att, def) {
  if (att.st !== 'attack' || !att.hitOn) return;
  if (def.st === 'ko' || def.st === 'down' || def.st === 'getup') return;
  if (def.st === 'attack' && def.atk && def.atk.invuln) return; // super armor
  const fr = att.anim.frames[att.anim.i];
  const h = att.pts[(fr && fr.hand) || att.atk.hand];
  const r = att.atk.air ? 14 : 11;
  if (Math.abs(h.x - def.x) < 17 * def.sc + r && h.y > def.bb.top - r && h.y < def.bb.bot + r) strike(att, def);

// ---------- AI ----------
function ai(f, o, dt) {
  const i = f.inp, a = f.ai, d = Math.abs(o.x - f.x) / f.sc, L = G.aiLvl;
  i.mv = 0; i.block = false;
  a.t -= dt;
  if (a.mode === 'approach' && d < 70) a.t = 0;
  if (a.t <= 0) {
    a.t = rand(.2, .5) / (1 + .2 * (L - 1));
    const threat = o.st === 'attack' && d < 130;
    if (f.meter >= 100 && d < 130 && Math.random() < .22 + .1 * L) { a.mode = 'super'; a.t = .2; }
    else if (threat && Math.random() < Math.min(.75, .25 + .15 * L)) { a.mode = 'block'; a.t = .35; }
    else if (d > 72) {
      a.mode = 'approach';
      if (d > 120 && d < 230 && Math.random() < .05 + .02 * L) { i.jump = .1; a.mode = 'jumpin'; a.t = .7; }
    } else {
      const r = Math.random();
      a.mode = r < .55 + .05 * L ? 'attack' : r < .8 ? 'retreat' : 'wait';
      if (a.mode === 'retreat') a.t = .3;
    }
  }
  const to = o.x > f.x ? 1 : -1;
  if (a.mode === 'approach') i.mv = to;
  else if (a.mode === 'retreat') i.mv = -to;
  else if (a.mode === 'block') i.block = true;
  else if (a.mode === 'jumpin') { i.mv = to; if (f.air > 0 && d < 115) i.kick = .1; }
  else if (a.mode === 'super') { if (f.meter >= 100) i.super = .1; }
  else if (a.mode === 'attack') {
    if (d < 75) {
      const r = Math.random();
      if (r < .14) { i.block = true; i.punch = .1; }        // uppercut
      else if (r < .28) { i.block = true; i.kick = .1; }    // sweep
      else if (r < .72) { i.punch = .1; a.combo = Math.random() < .25 + .15 * L; }
      else i.kick = .1;
      a.mode = 'wait'; a.t = rand(.25, .6) / (1 + .15 * L);
    } else i.mv = to;
  }
  if (a.combo && f.st === 'attack' && f.atk === ATK.jab) i.punch = .1;
  if (f.st !== 'attack') a.combo = false;
}

// ---------- INPUT ----------
const keys = {};
addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  initAC();
  if (e.repeat) return;
  keys[k] = true;
  if (G.paused) {
    if (k === 'Escape' || k === 'KeyP') { togglePause(); return; }
    uiNav(k, true); return;
  }
  switch (G.state) {
    case 'menu': uiNav(k, false); break;
    case 'select': selNav(k); break;
    case 'stage': stageNav(k); break;
    case 'how': if (k === 'Escape' || k === 'Backspace') { toMenu(); sfx.blip(); } break;
    case 'options': if (k === 'Escape' || k === 'Backspace') { toMenu(); sfx.blip(); } else uiNav(k, true); break;
    case 'fight': fightKeys(k); break;
    case 'match': if (k === 'Enter' || k === 'Space' || k === 'KeyJ') afterMatch(); break;
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { if (G.state === 'fight' && !G.paused) G.paused = true; });

cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  G.mx = (e.clientX - r.left) * W / r.width;
  G.my = (e.clientY - r.top) * H / r.height;
});
cv.addEventListener('mousedown', () => {
  initAC();
  if (G.paused) {
    for (const it of G.ui) if (inRect(it)) { it.cb(); sfx.sel(); break; }
    return;
  }
  if (G.state === 'how') { toMenu(); sfx.blip(); return; }
  if (G.state === 'match') { afterMatch(); return; }
  for (const it of G.ui) if (inRect(it)) { it.cb(); sfx.sel(); break; }
});
function inRect(it) { return it && G.mx >= it.x && G.mx <= it.x + it.w && G.my >= it.y && G.my <= it.y + it.h; }

// generic keyboard navigation for menu-ish screens
function uiNav(k, esc) {
  const n = G.ui.length; if (!n) return;
  if (k === 'KeyW' || k === 'ArrowUp' || k === 'KeyA' || k === 'ArrowLeft') { G.sel = (G.sel + n - 1) % n; sfx.blip(); }
  else if (k === 'KeyS' || k === 'ArrowDown' || k === 'KeyD' || k === 'ArrowRight') { G.sel = (G.sel + 1) % n; sfx.blip(); }
  else if (k === 'Enter' || k === 'Space' || k === 'KeyJ') { if (G.ui[G.sel]) { G.ui[G.sel].cb(); sfx.sel(); } }
  else if (esc && (k === 'Escape' || k === 'Backspace') && G.ui.esc) { G.ui.esc(); sfx.blip(); }
}
function selNav(k) {
  const n = CHARS.length;
  if (k === 'KeyA' || k === 'ArrowLeft') { G.sel = (G.sel + n - 1) % n; sfx.blip(); }
  else if (k === 'KeyD' || k === 'ArrowRight') { G.sel = (G.sel + 1) % n; sfx.blip(); }
  else if (k === 'Enter' || k === 'Space' || k === 'KeyJ' || k === 'Comma') selConfirm(G.sel);
  else if (k === 'Escape' || k === 'Backspace') { toMenu(); sfx.blip(); }
}
function selConfirm(i) {
  G.sel = i;
  if (G.selP === 1) {
    G.p1c = i; sfx.sel();
    if (G.mode === 'vs') { G.selP = 2; return; }
    G.p2c = irand(0, CHARS.length - 1);
    if (G.mode === 'arcade') { G.stageI = irand(0, STAGES.length - 1); beginMatch(); }
    else { G.state = 'stage'; G.sel = 0; }
  } else {
    G.p2c = i; sfx.sel(); G.state = 'stage'; G.sel = 0;
  }
}
function stageNav(k) {
  const n = STAGES.length + 1;
  if (k === 'KeyA' || k === 'ArrowLeft') { G.sel = (G.sel + n - 1) % n; sfx.blip(); }
  else if (k === 'KeyD' || k === 'ArrowRight') { G.sel = (G.sel + 1) % n; sfx.blip(); }
  else if (k === 'Enter' || k === 'Space' || k === 'KeyJ' || k === 'Comma') {
    G.stageI = G.sel === STAGES.length ? irand(0, STAGES.length - 1) : G.sel;

function fightKeys(k) {

    const a = f.keymap[k];

function togglePause() { G.paused = !G.paused; sfx.blip(); }

// ---------- FLOW ----------
function resetRound() {

  P1 = new F(300, 1, G.p1c, 'p1');
  E = new F(660, -1, G.p2c, G.mode === 'vs' ? 'p2' : 'cpu', G.p2c === G.p1c);

  G.state = 'intro'; G.t = 0; G.ts = 1; G.clock = 60; G.winner = null; G.koReason = null; G.perfect = 0;

}
function demoReset() {
  G.p1c = irand(0, CHARS.length - 1); G.p2c = irand(0, CHARS.length - 1);
  P1 = new F(280, 1, G.p1c, 'demo');
  E = new F(680, -1, G.p2c, 'demo', G.p2c === G.p1c);
  P1.opp = E; E.opp = P1;
  G.demoT = 0; G.sparks = []; G.pops = [];
}
function beginMatch() {

  G.aiLvl = G.mode === 'arcade' ? Math.min(9, [1, 2.5, 4][OPTS.diff] + (G.lvl - 1))
          : G.mode === 'training' ? 1 : [1, 2.5, 4][OPTS.diff];
  G.flakes = STAGES[G.stageI].snow
    ? Array.from({ length: 90 }, () => ({ x: rand(0, W), y: rand(0, H), v: rand(40, 110), d: rand(-20, 20), r: rand(1.5, 3.5) }))

}

  else { G.round++; resetRound(); }
}
function timeUp() {
  G.state = 'ko'; G.koReason = 'time'; G.t = 0; G.ts = 1; G.hitstop = 0;
  G.winner = P1.hp > E.hp ? P1 : E.hp > P1.hp ? E : null;
  if (G.winner) G.wins[G.winner === P1 ? 0 : 1]++;

}
function toMenu() { G.state = 'menu'; G.sel = 0; G.paused = false; MUSIC.stop(); demoReset(); }
function startArcade() { G.mode = 'arcade'; G.selP = 1; G.sel = 0; G.state = 'select'; }
function startQuick() { G.mode = 'quick'; G.p2c = irand(0, CHARS.length - 1); G.stageI = irand(0, STAGES.length - 1); beginMatch(); }
function startVS() { G.mode = 'vs'; G.selP = 1; G.sel = 0; G.state = 'select'; }
function startTraining() { G.mode = 'training'; G.spar = false; G.selP = 1; G.sel = 0; G.state = 'select'; }

// ---------- UPDATE ----------
function readInputs() {
  for (const f of [P1, E]) {
    if (f.ctrl !== 'p1' && f.ctrl !== 'p2') continue;
    const m = f.map, i = f.inp;
    i.mv = (down(m.right) ? 1 : 0) - (down(m.left) ? 1 : 0);
    i.block = down(m.block);
  }
}
function stepFighters(sdt, demo) {
  P1.update(sdt); E.update(sdt);
  const dx = E.x - P1.x, min = 16 * (P1.sc + E.sc);
  if (Math.abs(dx) < min && P1.air < 40 && E.air < 40 && P1.st !== 'ko' && E.st !== 'ko') {
    const push = (min - Math.abs(dx)) / 2 * Math.sign(dx || 1);
    P1.x = clamp(P1.x - push, 50, W - 50); E.x = clamp(E.x + push, 50, W - 50);
  }
  P1.compute(); E.compute();
  if (G.state === 'fight' || demo) { checkHits(P1, E); checkHits(E, P1); }
}

function update(dt) {
  G.time += dt;
  for (const s of G.sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 900 * dt; s.life -= dt; }
  G.sparks = G.sparks.filter(s => s.life > 0);
  for (const p of G.pops) { p.life -= dt; p.y -= 30 * dt; }
  G.pops = G.pops.filter(p => p.life > 0);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - 50 * dt);
  if (G.paused) return;
  if (G.hitstop > 0) { G.hitstop -= dt; return; }

  const sdt = dt * G.ts;
  G.t += dt;

  if (G.state === 'menu') {
    G.aiLvl = 2;
    ai(P1, E, sdt); ai(E, P1, sdt);
    stepFighters(sdt, true);
    if (P1.hp <= 0 || E.hp <= 0) {
      if (!G.demoT) G.demoT = 1.6;
      else { G.demoT -= dt; if (G.demoT <= 0) demoReset(); }
    }
    return;
  }
  if (G.state === 'options') { if (G.optMsgT > 0) G.optMsgT -= dt; return; }
  if (G.state === 'select' || G.state === 'stage' || G.state === 'how') return;

  // snow particles
  if (G.flakes.length && ['vs', 'intro', 'fight', 'ko', 'match'].includes(G.state)) {
    for (const f of G.flakes) {
      f.y += f.v * dt; f.x += f.d * dt + Math.sin(G.time * 2 + f.y * .02) * 10 * dt;
      if (f.y > H + 5) { f.y = -5; f.x = rand(0, W); }
      if (f.x > W + 5) f.x = -5; if (f.x < -5) f.x = W + 5;
    }
  }

  if (G.state === 'vs') {
    for (const f of [P1, E]) { f.loopPose('idle', IDLE_ANIM); f.updateAnim(sdt); f.compute(); }
    if (G.t > 1.5) { G.state = 'intro'; G.t = 0; }
    return;
  }
  if (G.state === 'intro') {
    for (const f of [P1, E]) { f.loopPose('idle', IDLE_ANIM); f.updateAnim(sdt); f.compute(); }
    if (G.t > 1.5) { G.state = 'fight'; G.t = 0; MUSIC.start(); }
    return;
  }
  if (G.state === 'fight') {
    if (G.mode !== 'training') {
      G.clock -= dt; G.stats.time += dt;
      if (G.clock <= 0) { G.clock = 0; timeUp(); return; }
    }
    readInputs();
    if (G.mode === 'training') {
      if (G.spar) ai(E, P1, sdt); else { E.inp.mv = 0; E.inp.block = false; }
      for (const f of [P1, E]) { f.hp = Math.min(f.maxhp, f.hp + 9 * dt); f.meter = 100; }
    } else if (E.ctrl === 'cpu') {
      ai(E, P1, sdt);
    }
    stepFighters(sdt);
    for (const f of [P1, E]) if (f.lag > f.hp) f.lag = Math.max(f.hp, f.lag - 35 * dt);
    return;
  }
  if (G.state === 'ko') {
    if (G.t > 1.0) G.ts = 1;
    stepFighters(sdt);
    if (G.t > 2.6) endRound();
    return;
  }
}

function text(s, x, y, size, fill, stroke, align) {

  text('TIME ' + mm + ':' + ss + '    MAX COMBO ' + G.stats.maxCombo[0] + '    DMG DEALT ' + G.stats.dmg[0], W / 2, 295, 20, '#444');
  if (G.mode === 'vs') text('P2: MAX COMBO ' + G.stats.maxCombo[1] + '    DMG ' + G.stats.dmg[1], W / 2, 325, 17, '#666');
  text('ENTER or CLICK - ' + (G.mode === 'arcade' && win ? 'NEXT BATTLE' : 'BACK TO MENU'), W / 2, 395, 24, '#e0242b', '#fff');
  G.ui = [{ x: 0, y: 0, w: W, h: H, cb: afterMatch }];
  G.ui.esc = afterMatch;
}
function drawPause() {
  ctx.fillStyle = 'rgba(246,242,230,.82)'; ctx.fillRect(0, 0, W, H);
  text('PAUSED', W / 2, 130, 60, '#16264d', '#fff');
  const items = [
    ['RESUME', togglePause],
    ['RESTART MATCH', () => { G.paused = false; beginMatch(); }],
    ['QUIT TO MENU', () => toMenu()]
  ];
  G.ui = items.map((it, i) => ({ x: W / 2 - 150, y: 210 + i * 56, w: 300, h: 44, cb: it[1] }));
  G.ui.esc = togglePause;
  items.forEach((it, i) => {
    const box = G.ui[i], on = inRect(box) || i === G.sel;
    if (inRect(box)) G.sel = i;
    rr(box.x, box.y, box.w, box.h, 10);
    ctx.fillStyle = on ? '#fff' : 'rgba(255,255,255,.55)'; ctx.fill();
    ctx.strokeStyle = on ? '#e0242b' : '#222'; ctx.lineWidth = on ? 4 : 2.5; ctx.stroke();
    text(it[0], W / 2, box.y + 23, 22, on ? '#16264d' : '#333');
  });
  text('ESC / P - RESUME', W / 2, H - 30, 15, '#888');
}
function drawStageFX() {
  const st = STAGES[G.stageI];
  if (st.snow && G.flakes.length) {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (const f of G.flakes) { ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); }
  }
  if (st.glows) for (const g of st.glows) {
    ctx.save(); ctx.globalAlpha = .1 + .08 * Math.sin(G.time * 6 + g[0]);
    ctx.fillStyle = g[4];
    ctx.beginPath(); ctx.ellipse(g[0], g[1], g[2], g[3], 0, 0, 7); ctx.fill();
    ctx.restore();
  }
}
function drawHUD() {
  bar(P1, 60, false); bar(E, W - 60 - 350, true);
  meterBar(P1, 60, false); meterBar(E, W - 60 - 350, true);
  const tc = G.stageI === 2 ? '#dfe4ff' : '#222'; // light text on the dark neon stage
  text(P1.char.name + ' - ' + (G.mode === 'vs' ? 'P1' : 'YOU'), 60, 84, 15, tc, null, 'left');
  text(E.char.name + ' - ' + (E.ctrl === 'cpu' ? 'CPU LV ' + Math.max(1, Math.round(G.aiLvl)) : 'P2'), W - 60, 84, 15, tc, null, 'right');
  pips(G.wins[0], 70, 1); pips(G.wins[1], W - 70, -1);
  if (G.mode !== 'training') {
    text('ROUND ' + G.round, W / 2, 30, 18, tc);
    text(String(Math.ceil(G.clock)), W / 2, 62, 38, G.clock <= 10 ? '#e0242b' : tc, '#fff');
  } else text('TRAINING', W / 2, 40, 20, G.stageI === 2 ? '#dfe4ff' : '#555');
  if (P1.combo >= 2) text(P1.combo + ' HIT COMBO!', 250, 134, 24, P1.col, '#fff');
  if (E.combo >= 2) text(E.combo + ' HIT COMBO!', W - 250, 134, 24, E.col, '#fff');
  const hc = G.stageI === 2 ? 'rgba(255,255,255,.5)' : 'rgba(0,0,0,.35)';
  if (G.mode === 'training') text('T - CPU ' + (G.spar ? 'ON' : 'OFF') + '   R - RESET   HP REGENS', W / 2, H - 12, 15, hc);
  else text('A/D move - W jump - S block - J punch (J,J combo) - S+J uppercut - S+K sweep - K kick - L SUPER', W / 2, H - 12, 14, hc);
}

function renderFight() {
  ctx.drawImage(BGS[G.stageI], 0, 0);
  drawStageFX();
  ctx.save();
  if (G.shake > 0 && OPTS.shake) ctx.translate(rand(-1, 1) * G.shake, rand(-1, 1) * G.shake);
  if (G.state === 'ko' && G.koReason === 'ko') {
    const z = 1 + .16 * clamp(G.t / .6, 0, 1), cx = clamp((P1.x + E.x) / 2, 240, 720), cy = 290;
    ctx.translate(cx, cy); ctx.scale(z, z); ctx.translate(-cx, -cy);
  }
  const order = E.st === 'attack' && P1.st !== 'attack' ? [P1, E] : [E, P1];
  for (const f of order) f.draw();
  for (const s of G.sparks) {
    ctx.strokeStyle = s.col; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * .03, s.y - s.vy * .03); ctx.stroke();
  }
  for (const p of G.pops) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = clamp(p.life * 3, 0, 1);
    text(p.text, 0, 0, 30 + (.55 - p.life) * 10, p.col, '#fff'); ctx.restore();
  }
  ctx.restore();
  if (G.state !== 'vs') drawHUD();
  if (G.state === 'vs') drawVS();
  if (G.state === 'intro') drawIntro();
  if (G.state === 'ko') drawKO();
  if (G.state === 'match') drawMatch();
  if (G.paused) drawPause();
}

function render() {
  G.ui = [];
  if (G.state === 'menu') renderMenu();
  else if (G.state === 'select') renderSelect();
  else if (G.state === 'stage') renderStageSel();
  else if (G.state === 'how') renderHow();
  else if (G.state === 'options') renderOpts();
  else renderFight();
  let hov = false;
  for (const it of G.ui) if (inRect(it)) { hov = true; break; }
  cv.style.cursor = hov ? 'pointer' : 'default';
}

// ---------- LOOP ----------
demoReset();
let last = performance.now();
function loop(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
